[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC}"
lasna = "${LASNA_RPC}"

[fmt]
bracket_spacing = true
line_length = 120

[lint]
lint_on_build = false
